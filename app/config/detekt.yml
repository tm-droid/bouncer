build:
  maxIssues: 0

comments:
  active: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  CognitiveComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  TooManyFunctions:
    active: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInObjects: 11
    thresholdInInterfaces: 11
    thresholdInEnums: 11
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false
  ComplexCondition:
    active: false
  ComplexInterface:
    active: false
  LargeClass:
    active: false
  LongParameterList:
    active: false
  MethodOverloading:
    active: false
  NamedArguments:
    active: false
  NestedBlockDepth:
    active: false
  NestedScopeFunctions:
    active: false
  ReplaceSafeCallChainWithRun:
    active: false
  StringLiteralDuplication:
    active: false

coroutines:
  active: true

empty-blocks:
  active: true

# Kept for the rules that catch a swallowed failure. The generic-catch rules are OFF on purpose:
# `catch (e: Exception) { Sentry.captureException(e); ... }` is this codebase's deliberate house
# style at ~262 sites, and flagging all of them would say nothing.
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  TooGenericExceptionThrown:
    active: true


naming:
  active: true
  FunctionNaming:
    # Composables are PascalCase by convention; without this every one of ~800 is a finding.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # Several composables per file is the norm here.
    active: false

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true

# Enabled for the dead-code and correctness rules. The purely typographic ones are off: this is a
# Compose codebase, where MagicNumber flags every dp value (2352 of them) and WildcardImport flags
# an import style used consistently throughout.
style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  ReturnCount:
    # Guard clauses are used everywhere; a return-count cap fights the house style.
    active: false
  ForbiddenComment:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  UnusedParameter:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedPrivateMember:
    active: true
