# BOUNCER ATOMIC STABILITY CONFIG
# G1GC is the JDK 21 default and handles Gradle daemon memory better than ParallelGC.
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Disable VFS watch: iCloud Drive generates a constant stream of synthetic FSEvents
# (metadata updates during background syncing) that trick Gradle into treating source
# files as modified, causing it to discard up-to-date task results and re-run everything.
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# Keep workers limited to avoid overwhelming the I/O system, especially if in an iCloud-synced folder
org.gradle.workers.max=4

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# Increase Kotlin daemon memory
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Use daemon strategy for stability
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true

# Disable unused Android build features globally
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Skip non-essential tasks in debug
android.debug.obfuscation.force=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
