# BOUNCER ATOMIC STABILITY CONFIG
# G1GC is the JDK 21 default and handles Gradle daemon memory better than ParallelGC.
# SoftRefLRUPolicyMSPerMB=0 lets G1 aggressively collect soft-reference caches, reducing
# "too many open files" / OOM noise during annotation processing.
# MaxMetaspaceSize caps metaspace growth that is otherwise unbounded.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Limit parallel workers to avoid contention; tune to 2×(CPU cores - 1) if build is CPU-bound.
org.gradle.workers.max=4

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# Kotlin daemon JVM — give the Kotlin compiler daemon enough heap to avoid GC pauses
# while keeping it below the Gradle daemon allocation.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Kotlin incremental compilation — dramatically reduces re-compilation scope on source changes.
kotlin.incremental=true
# Force daemon compilation strategy so the Kotlin daemon is always spun up and reused
# across builds rather than falling back to in-process or worker-API compilation.
kotlin.compiler.execution.strategy=daemon

# Disable unused Android build features globally; individual modules can re-enable them.
# Skipping these code-gen steps measurably reduces incremental build times.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Skip non-essential tasks in debug
android.debug.obfuscation.force=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Suppress sync issue warning about library component constraints
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
