version: 2

# Monthly, not weekly, wherever a PR starts a CI run: this repo's Actions minutes are billed, and
# every Gradle or github-actions PR runs the Android checks (a github-actions bump edits ci.yml,
# which runs everything). Security updates do not wait for the schedule. my-video and
# android-dev-mcp-server stay weekly because their PRs start no run (ci.yml's paths-ignore).

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    ignore:
      # Not in the app. Every one of these resolves on `androidLintTool` or on the Unified Test
      # Platform's configuration (com.android.tools.utp:android-device-provider-ddmlib ->
      # io.grpc:grpc-netty -> io.netty), never on releaseRuntimeClasspath — verified with
      # `./gradlew :app:dependencies --configuration releaseRuntimeClasspath`. Dependabot cannot
      # fix them either: they are AGP's own transitives, so the only way it can "bump" one is to
      # edit a force() line, and forcing a version AGP was not tested against is how the test
      # runner's classpath ends up on a Netty line grpc 1.57 cannot call. Alerts for these are
      # dismissed as not-used; PRs for them are noise.
      - dependency-name: "io.netty:*"
      - dependency-name: "io.grpc:*"
      - dependency-name: "org.bouncycastle:*"
      - dependency-name: "org.apache.httpcomponents:*"
      - dependency-name: "org.apache.commons:commons-lang3"
      - dependency-name: "org.bitbucket.b_c:jose4j"
      - dependency-name: "org.jdom:jdom2"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlinx.*"
      firebase:
        patterns:
          - "com.google.firebase.*"
          - "com.google.gms.*"
      networking:
        patterns:
          - "com.squareup.retrofit2.*"
          - "com.squareup.okhttp3.*"
          - "io.ktor.*"
          - "io.coil-kt.*"
      # Everything the groups above miss, in one PR. A group takes the first dependency it matches,
      # so the named groups keep theirs; majors stay separate PRs.
      everything-else:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # One entry per Appwrite function directory. Security updates reach any manifest in the
  # dependency graph on their own, but VERSION updates only reach the directories listed here,
  # and only highlights-sync was listed — so the other nine functions drifted until something
  # in them became a CVE and a security PR arrived. Keeping them current is the cheaper half.
  #
  # Each one groups all its updates into a single PR and allows one open PR at a time: ten
  # ungrouped directories at the old limit of 5 would be up to fifty PRs a week at one
  # maintainer, which is how a review queue stops being read at all.
  - package-ecosystem: "npm"
    directory: "/appwrite/functions/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "appwrite"
    ignore:
      # node-appwrite 15 is a deliberate pin, not drift. The functions are written against its
      # API surface — `listDocuments` (there is no `listRows`), and `parseJsonFile` returning an
      # already-parsed object for application/json, which is the bug that made player-search
      # rebuild its whole index on every query. A major bump here is a migration with its own
      # verification, not a dependency refresh.
      - dependency-name: "node-appwrite"
        update-types: ["version-update:semver-major"]
    groups:
      api:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/appwrite/functions/match-sync"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "appwrite"
    ignore:
      # node-appwrite 15 is a deliberate pin, not drift. The functions are written against its
      # API surface — `listDocuments` (there is no `listRows`), and `parseJsonFile` returning an
      # already-parsed object for application/json, which is the bug that made player-search
      # rebuild its whole index on every query. A major bump here is a migration with its own
      # verification, not a dependency refresh.
      - dependency-name: "node-appwrite"
        update-types: ["version-update:semver-major"]
    groups:
      match-sync:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/appwrite/functions/train-win-probability"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "appwrite"
    ignore:
      # node-appwrite 15 is a deliberate pin, not drift. The functions are written against its
      # API surface — `listDocuments` (there is no `listRows`), and `parseJsonFile` returning an
      # already-parsed object for application/json, which is the bug that made player-search
      # rebuild its whole index on every query. A major bump here is a migration with its own
      # verification, not a dependency refresh.
      - dependency-name: "node-appwrite"
        update-types: ["version-update:semver-major"]
    groups:
      train-win-probability:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/android-dev-mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      android-dev-mcp-server:
        patterns:
          - "*"

  # The Remotion promo video. Dev tooling only — nothing here is compiled into the app or
  # deployed anywhere — but it has its own lockfile, so it raises its own alerts and needs its
  # own entry for version updates to reach it.
  - package-ecosystem: "npm"
    directory: "/my-video"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      my-video:
        patterns:
          - "*"

  # One PR for every action: each PR edits ci.yml, and each ci.yml change runs every check.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
