version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "android"

  - package-ecosystem: "npm"
    directory: "/appwrite/functions/highlights-sync"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "appwrite"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
