name: Weekly Logo Update

on:
  schedule:
    # 09:00 UTC on Mondays. It was daily, but the logos rarely change and this repo's Actions minutes
    # are billed; a week's delay costs nothing.
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-logos:
    runs-on: ubuntu-latest
    # The lookups are throttled to each source's rate limit and capped per run; this is a backstop.
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        # The Android app, its functions and tools live under android/ in the monorepo.
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The script exits non-zero if a page is unreachable or the corpus comes back short, which
      # fails the job rather than committing a truncated asset. The version this replaced fetched
      # nothing at all and reported "No changes to commit" on every run for five months.
      - name: Run update_logos.py
        run: python tools/update_logos.py

      # Logos for the sides Cricbuzz's pages don't give one (TheSportsDB, Wikidata, a variant's
      # parent side), and each source's own colours into tools/team_lookups.json. The pure parts are
      # tested offline first, so a broken parser fails here rather than writing a bad asset.
      - name: Run update_logos_extra.py
        run: |
          pip install --quiet pillow cairosvg
          python -m unittest discover -s tools/tests
          python tools/update_logos_extra.py

      # Team colours for every side the hand-picked table in TeamPalettes.kt does not list: the
      # sources' kit colours, then the crest, then the national flag (flag-icons, MIT, pinned).
      - name: Run extract_team_colors.py
        run: |
          mkdir -p "$RUNNER_TEMP/flag-icons"
          npm pack flag-icons@7.6.0 --silent --pack-destination "$RUNNER_TEMP/flag-icons"
          tar xzf "$RUNNER_TEMP/flag-icons/flag-icons-7.6.0.tgz" -C "$RUNNER_TEMP/flag-icons"
          FLAG_ICONS_DIR="$RUNNER_TEMP/flag-icons/package/flags/4x3" python tools/extract_team_colors.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/TeamLogos.json app/src/main/assets/TeamAcronyms.json app/src/main/assets/TeamColors.json app/src/main/assets/TeamLogoInk.json tools/team_lookups.json
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update team logos, acronyms and colours"
            git push
          fi
