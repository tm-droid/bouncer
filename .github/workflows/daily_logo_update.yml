name: Weekly Logo Update

on:
  schedule:
    # 09:00 UTC on Mondays. It was daily, but the logos rarely change and this repo's Actions minutes
    # are billed; a week's delay costs nothing.
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-logos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The script exits non-zero if a page is unreachable or the corpus comes back short, which
      # fails the job rather than committing a truncated asset. The version this replaced fetched
      # nothing at all and reported "No changes to commit" on every run for five months.
      - name: Run update_logos.py
        run: python tools/update_logos.py

      # Crest-derived team colours for every side the hand-picked table in TeamPalettes.kt does not
      # list. Runs after the logo refresh so a new crest gets its colours the same week.
      - name: Run extract_team_colors.py
        run: |
          pip install --quiet pillow
          python tools/extract_team_colors.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/TeamLogos.json app/src/main/assets/TeamAcronyms.json app/src/main/assets/TeamColors.json
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update team logos, acronyms and colours"
            git push
          fi
