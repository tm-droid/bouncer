# Required GitHub Secrets:
#
# Signing:
#   KEYSTORE_BASE64           — base64 -i app/bouncer-release.keystore | pbcopy, then paste here
#   KEYSTORE_PASSWORD         — keystore store password
#   KEY_ALIAS                 — bouncer
#   KEY_PASSWORD              — key password (same as KEYSTORE_PASSWORD for PKCS12)
#
# Play Store:
#   PLAY_SERVICE_ACCOUNT_JSON — full JSON of service account
#                               bouncer-ci@golden-object-498303-q9.iam.gserviceaccount.com
#
# API Keys (injected as BuildConfig fields at compile time):
#   RAPIDAPI_KEY
#   GROQ_API_KEY
#   CEREBRAS_API_KEY
#   SAMBANOVA_API_KEY
#   APPWRITE_ENDPOINT
#   APPWRITE_PROJECT_ID
#   APPWRITE_AI_CACHE_DB_ID
#   APPWRITE_AI_CACHE_COL_ID
#   APPWRITE_FAVOURITES_COL_ID
#   HIGHLIGHTLY_API_KEY
#   APPWRITE_HIGHLIGHTS_DB_ID
#   APPWRITE_HIGHLIGHTS_COL_ID
#   APPWRITE_PLAYER_FORMS_DB_ID
#   APPWRITE_PLAYER_FORMS_COL_ID
#   APPWRITE_PLAYER_PROFILES_COL_ID
#
# Error tracking:
#   SENTRY_AUTH_TOKEN         — Sentry auth token (ProGuard mapping upload on release)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          RAPIDAPI_KEY=
          GROQ_API_KEY=
          CEREBRAS_API_KEY=
          SAMBANOVA_API_KEY=
          APPWRITE_ENDPOINT=
          APPWRITE_PROJECT_ID=
          APPWRITE_AI_CACHE_DB_ID=
          APPWRITE_AI_CACHE_COL_ID=
          APPWRITE_FAVOURITES_COL_ID=
          HIGHLIGHTLY_API_KEY=
          APPWRITE_HIGHLIGHTS_DB_ID=
          APPWRITE_HIGHLIGHTS_COL_ID=
          APPWRITE_PLAYER_FORMS_DB_ID=
          APPWRITE_PLAYER_FORMS_COL_ID=
          APPWRITE_PLAYER_PROFILES_COL_ID=
          KEYSTORE_PASSWORD=placeholder
          KEY_ALIAS=placeholder
          KEY_PASSWORD=placeholder
          EOF

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: app/build/reports/tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          RAPIDAPI_KEY=
          GROQ_API_KEY=
          CEREBRAS_API_KEY=
          SAMBANOVA_API_KEY=
          APPWRITE_ENDPOINT=
          APPWRITE_PROJECT_ID=
          APPWRITE_AI_CACHE_DB_ID=
          APPWRITE_AI_CACHE_COL_ID=
          APPWRITE_FAVOURITES_COL_ID=
          HIGHLIGHTLY_API_KEY=
          APPWRITE_HIGHLIGHTS_DB_ID=
          APPWRITE_HIGHLIGHTS_COL_ID=
          APPWRITE_PLAYER_FORMS_DB_ID=
          APPWRITE_PLAYER_FORMS_COL_ID=
          APPWRITE_PLAYER_PROFILES_COL_ID=
          KEYSTORE_PASSWORD=placeholder
          KEY_ALIAS=placeholder
          KEY_PASSWORD=placeholder
          EOF

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/bouncer-release.keystore

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY=${{ secrets.SAMBANOVA_API_KEY }}
          APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_AI_CACHE_DB_ID=${{ secrets.APPWRITE_AI_CACHE_DB_ID }}
          APPWRITE_AI_CACHE_COL_ID=${{ secrets.APPWRITE_AI_CACHE_COL_ID }}
          APPWRITE_FAVOURITES_COL_ID=${{ secrets.APPWRITE_FAVOURITES_COL_ID }}
          HIGHLIGHTLY_API_KEY=${{ secrets.HIGHLIGHTLY_API_KEY }}
          APPWRITE_HIGHLIGHTS_DB_ID=${{ secrets.APPWRITE_HIGHLIGHTS_DB_ID }}
          APPWRITE_HIGHLIGHTS_COL_ID=${{ secrets.APPWRITE_HIGHLIGHTS_COL_ID }}
          APPWRITE_PLAYER_FORMS_DB_ID=${{ secrets.APPWRITE_PLAYER_FORMS_DB_ID }}
          APPWRITE_PLAYER_FORMS_COL_ID=${{ secrets.APPWRITE_PLAYER_FORMS_COL_ID }}
          APPWRITE_PLAYER_PROFILES_COL_ID=${{ secrets.APPWRITE_PLAYER_PROFILES_COL_ID }}
          EOF

      - name: Build release AAB
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.parallel=true"
        run: ./gradlew bundleRelease --no-daemon --stacktrace -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  publish:
    name: Publish to Play Store (Internal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/

      - uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tanush.bouncer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
