# Required GitHub Secrets:
#
# Signing:
#   KEYSTORE_BASE64           — base64 -i app/bouncer-release.keystore | pbcopy, then paste here
#   KEYSTORE_PASSWORD         — keystore store password
#   KEY_ALIAS                 — bouncer
#   KEY_PASSWORD              — key password (same as KEYSTORE_PASSWORD for PKCS12)
#
# Play Store:
#   PLAY_SERVICE_ACCOUNT_JSON — full JSON of service account
#                               bouncer-ci@golden-object-498303-q9.iam.gserviceaccount.com
#
# No API key and no Appwrite id is a secret here. The app holds no credentials, and the Appwrite
# ids plus the Sentry DSN are read from local.properties.template.
#
# Error tracking:
#   SENTRY_AUTH_TOKEN         — Sentry auth token (ProGuard mapping upload on release)
#
# Coverage (optional; the upload is skipped while unset):
#   CODECOV_TOKEN             — repository upload token from app.codecov.io (Student Pack account)
#
# Minutes. This repo is private, so every minute is billed, and in the first half of October 2026
# it spent ~2,170 of them: six jobs per push, each paying its own checkout, JDK, cache restore and
# Gradle configuration, and each rounded up to a whole minute — plus a release build on every push,
# including the 4 in 10 that changed only the functions and so had nothing to upload. Now there is
# one job, it does only what the push's changes call for, and pushes that change nothing it checks
# start no run at all (paths-ignore). The checks still gate the upload: they run first in the same
# Gradle invocation, and any failure ends the job before the publish steps.
#
# Second pass, October 2026, after the minutes ran out: a push is measured against the last commit
# that passed (and, for the bundle, the last one that shipped) rather than against the previous
# push, so a failed or cancelled run is carried by the next one. A dispatch is measured against
# main instead of counting as everything. Pushes that change only tests or the detekt and lint
# baselines, or whose head commit says `Ship: no`, check without bundling. Gradle stops at the
# first failure, and the dependency graph is submitted only when the dependencies change.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ignored
      - '**/*.md'
      - '.claude/**'
      - '.devcontainer/**'
      - 'my-video/**'
      - 'android-dev-mcp-server/**'
      - '.github/dependabot.yml'
  # The same list. Dependabot's my-video and MCP-server PRs start no run.
  pull_request:
    paths-ignore: *ignored
  # What the branch changed against main: its checks, and the release bundle if it changed what
  # ships (kept, so that main fast-forwarded to the same commit ships it without a rebuild).
  # `everything` runs every check and the bundle whatever changed; `publish` bundles and uploads
  # to Play as well.
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the bundle to Play (internal + closed testing)
        type: boolean
        default: false
      everything:
        description: Run every check and build the bundle, whatever changed
        type: boolean
        default: false

# A newer push cancels an older run on a pull request, never on main. On main a run can end in an
# upload to Play, and cancelling one part-way through that upload leaves a release half made.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: Check, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only, the repository default: this job runs npm installs and the whole Gradle build.
    # Only the dependency-graph job below can write.
    permissions:
      contents: read
      # Read-only, for the run lookups below: the last commit that passed, the last that shipped,
      # and whether this exact commit already has a tested bundle.
      actions: read
    outputs:
      depgraph: ${{ steps.changes.outputs.depgraph }}
    # Job-level so a step's `if` can see it; a step `if` cannot read `secrets`.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # What has to run, from what changed since a base:
      #   pull request — its base.
      #   push to main, and a dispatch — for the checks, the newest commit (in this one's history)
      #                  whose push run on main passed; for the bundle, the newest whose push run
      #                  shipped. Not `before`: GitHub cancels a run still pending when a newer push
      #                  arrives, and a run can fail, and either way the next push has to carry what
      #                  that one never checked or shipped. A dispatch uses the same bases, so main
      #                  fast-forwarded to a dispatched commit can ship its bundle (below) knowing
      #                  the dispatch checked everything the push would have.
      # A base that cannot be found (the API down, no passing run in reach) falls back to `before`,
      # or for a dispatch to where the branch left main; an unreadable one counts as everything.
      #
      #   android   — lint, detekt and the unit tests: an app path or this file changed.
      #   functions — every function's `node --test`: appwrite/ or this file changed.
      #   parity    — the unit tests alone: a file outside app/ that a unit test reads changed.
      #               The list is read from the `inputs.files` declarations in app/build.gradle.kts,
      #               which every such test needs anyway, so it cannot drift.
      #   bundle    — the release bundle: something that ships changed (tests and the detekt and
      #               lint baselines do not ship), and the head commit does not carry `Ship: no`.
      #               A skipped push is carried by the next push that ships.
      #   ship      — the Play upload: `bundle` on a push to main, or a dispatch with `publish`.
      #   depgraph  — submit the dependency graph: a bundling run on main whose range touched a
      #               dependency declaration. Between submissions GitHub keeps the last one.
      - name: What changed?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLISH: ${{ inputs.publish }}
          EVERYTHING: ${{ inputs.everything }}
        run: |
          set -euo pipefail
          app='^(app/|baselineprofile/|gradle/|distribution/|[^/]*\.gradle\.kts$|gradle\.properties$|local\.properties\.template$)'
          unshipped='^app/(src/(test|androidTest)/|config/|lint-baseline\.xml$)'
          deps='(^gradle/|\.gradle\.kts$|^gradle\.properties$)'
          workflow='^\.github/workflows/ci\.yml$'
          parity_re=$(grep -oE 'rootProject\.file\("[^"]+"\)' app/build.gradle.kts \
            | sed -E 's/^rootProject\.file\("(.*)"\)$/\1/; s/\./\\./g; s/^/^/; s/$/$/' | paste -sd'|' -)

          is_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          since() { if is_commit "$1"; then git diff --name-only "$1" "${GITHUB_SHA}"; else echo ALL; fi; }
          changed() { [ "$1" = ALL ] || grep -qE "$2" <<< "$1"; }
          # The ids of a run's unexpired artifacts that match a jq condition on `.name`.
          artifacts() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/artifacts" \
              --jq ".artifacts[] | select(($2) and .expired == false) | .id" 2>/dev/null || true
          }
          ships() {
            [ "$1" = ALL ] && return 0
            local m
            m=$(grep -E "${app}" <<< "$1" | grep -vE "${unshipped}" || true)
            [ -n "${m}" ]
          }

          check_base="${BEFORE}"; ship_base="${BEFORE}"
          if [ "${EVENT}" = pull_request ]; then
            check_base="${PR_BASE}"; ship_base="${PR_BASE}"
          else
            if [ "${EVENT}" = workflow_dispatch ]; then
              check_base=$(git merge-base origin/main "${GITHUB_SHA}" 2>/dev/null || true); ship_base="${check_base}"
            fi
            # Newest first. A run that shipped left a `shipped` artifact, or, before that existed, a
            # `release-aab` one (a push run uploads only what it built to ship).
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' 2>/dev/null || true)
            passed=""
            while read -r id sha; do
              if ! { is_commit "${sha:-}" && git merge-base --is-ancestor "${sha}" "${GITHUB_SHA}"; }; then continue; fi
              if [ -z "${passed}" ]; then passed="${sha}"; fi
              if [ -n "$(artifacts "${id}" '.name == "shipped" or .name == "release-aab"')" ]; then
                ship_base="${sha}"
                break
              fi
            done <<< "${runs}"
            if [ -n "${passed}" ]; then check_base="${passed}"; fi
          fi
          echo "Checks since ${check_base:-nothing}; bundle since ${ship_base:-nothing}."

          checked=$(since "${check_base}")
          to_ship=$(since "${ship_base}")
          # A dispatch that publishes runs every check: it is how a commit gets shipped by hand.
          if [ "${EVENT}" = workflow_dispatch ] && { [ "${EVERYTHING}" = true ] || [ "${PUBLISH}" = true ]; }; then
            checked=ALL; to_ship=ALL
          fi
          head_message=$(git log -1 --format=%B "${GITHUB_SHA}")
          skip_ship=no
          if grep -qiE '^Ship:[[:space:]]*no[[:space:]]*$' <<< "${head_message}"; then skip_ship=yes; fi

          android=no; functions=no; parity=no; bundle=no; ship=no; depgraph=no
          if changed "${checked}" "${app}|${workflow}"; then android=yes; fi
          if changed "${checked}" "^appwrite/|${workflow}"; then functions=yes; fi
          if [ -n "${parity_re}" ] && changed "${checked}" "${parity_re}"; then parity=yes; fi
          if [ "${EVENT}" = workflow_dispatch ]; then
            if [ "${PUBLISH}" = true ] || [ "${EVERYTHING}" = true ]; then
              bundle=yes
            elif [ "${skip_ship}" = no ] && ships "${to_ship}"; then
              bundle=yes
            fi
            if [ "${PUBLISH}" = true ]; then ship=yes; fi
          elif [ "${EVENT}" = push ] && [ "${REF}" = refs/heads/main ] && [ "${skip_ship}" = no ] && ships "${to_ship}"; then
            bundle=yes; ship=yes
          fi
          if [ "${skip_ship}" = yes ]; then echo "The head commit says Ship: no; the next push that ships carries this one."; fi
          # A release whose exact commit already passed this workflow, with its signed bundle kept,
          # ships that bundle instead of building it again. That is the usual case: a branch is
          # checked by a dispatch, then main is fast-forwarded to it — the same tree, so the same
          # tests, lint, detekt and bundle, and ~18 billed minutes spent twice. The bundle's
          # Sentry mapping was uploaded when it was built. Its versionCode is that run's, which is
          # lower than this run's; if Play already holds a higher one the upload fails loudly, and
          # a dispatch with `publish` builds a fresh bundle.
          reuse=""
          if [ "${EVENT}" = push ] && [ "${bundle}" = yes ]; then
            for run in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=20" \
                --jq '.workflow_runs[].id' 2>/dev/null || true); do
              if [ -n "$(artifacts "${run}" '.name == "release-aab"')" ]; then
                reuse="${run}"
                break
              fi
            done
          fi
          if [ -n "${reuse}" ]; then
            echo "Commit ${GITHUB_SHA} passed in run ${reuse}; shipping its bundle without rebuilding."
            android=no; functions=no; parity=no; bundle=no
          fi
          if [ "${bundle}" = yes ] && [ "${REF}" = refs/heads/main ] && changed "${to_ship}" "${deps}"; then depgraph=yes; fi

          gradle=no
          if [ "${android}" = yes ] || [ "${parity}" = yes ] || [ "${bundle}" = yes ]; then gradle=yes; fi
          printf 'android=%s\nfunctions=%s\nparity=%s\ngradle=%s\nbundle=%s\nship=%s\ndepgraph=%s\nreuse=%s\nship_base=%s\n' \
            "${android}" "${functions}" "${parity}" "${gradle}" "${bundle}" "${ship}" "${depgraph}" "${reuse}" "${ship_base}" \
            | tee -a "$GITHUB_OUTPUT"

      # The provider ladder, the fact-checker, the rewrite backlog and the win-probability maths
      # exist only in JavaScript. First, because they take seconds and Gradle takes minutes.
      # npm's download cache is kept between runs, keyed on every lockfile below.
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.functions == 'yes'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            appwrite/functions/*/package-lock.json
            appwrite/tools/history/package-lock.json
            appwrite/tools/archive/package-lock.json

      - name: Run every function's tests
        if: steps.changes.outputs.functions == 'yes'
        run: |
          set -euo pipefail
          # appwrite/tools/history is the history-site builder (build-history.yml), not a function,
          # but its output is published publicly and its suite guards the scorecard arithmetic.
          # appwrite/tools/archive is the match archiver (publish-archiver.yml); its suite keeps raw
          # Cricbuzz text out of a public site and its classifier identical to match-sync's.
          #
          # The suites are independent, so they run side by side; each one's output is printed in its
          # own group once all have finished, and any failure fails the step.
          logs=$(mktemp -d)
          pids=()
          dirs=()
          for dir in appwrite/functions/*/ appwrite/tools/history/ appwrite/tools/archive/; do
            grep -q '"test"' "$dir/package.json" 2>/dev/null || continue
            log="${logs}/$(echo "$dir" | tr '/' '_').log"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund && npm test) > "$log" 2>&1 &
            pids+=($!)
            dirs+=("$dir")
          done
          failed=0
          for i in "${!pids[@]}"; do
            status=0
            wait "${pids[$i]}" || status=$?
            dir="${dirs[$i]}"
            echo "::group::${dir} (exit ${status})"
            cat "${logs}/$(echo "$dir" | tr '/' '_').log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then echo "::error::${dir} failed"; failed=1; fi
          done
          exit "$failed"

      # detekt 1.23 cannot run on JDK 25; 21 is what this workflow uses throughout.
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.gradle == 'yes'
        with:
          java-version: '21'
          distribution: temurin

      # Saves the Gradle home after each main run — dependencies and the local build cache — and
      # only reads it on pull requests. The build cache is what makes a parity-only push cheap:
      # its compile and the tests whose inputs did not change come back FROM-CACHE. setup-java's
      # `cache: gradle` could not do that: it saves only when its key is new, so the build cache
      # inside froze at the first save. This is the default (enhanced) provider, free for private
      # repositories in preview; `cache-provider: basic` is the always-free fallback, and is
      # setup-java's behaviour again.
      #
      # The dependency graph is recorded from the release build, which resolves
      # releaseRuntimeClasspath — the graph Dependabot alerts read — and saved as an artifact for
      # the dependency-graph job to submit, only when a dependency declaration changed. It replaces
      # the repository's "Automatic dependency submission", a second Gradle run on every push (~280
      # minutes in the first half of October 2026), which must stay off in the repository settings.
      # GitHub keeps the last snapshot between submissions.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.changes.outputs.gradle == 'yes'
        with:
          dependency-graph: ${{ steps.changes.outputs.depgraph == 'yes' && 'generate-and-upload' || 'disabled' }}

      - name: Decode keystore
        if: steps.changes.outputs.bundle == 'yes'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/bouncer-release.keystore

      # The Appwrite ids and the Sentry DSN come from the checked-in template, not from secrets:
      # they are public configuration, and the release job used to read them from secrets that
      # were never created. Every line came out as `KEY=`, so each build published to Play from
      # 2026-09-22 had a blank endpoint — no Appwrite call at all — and no DSN to report it, while
      # CI stayed green. `verifyReleaseConfig` now fails bundleRelease on a blank.
      #
      # The same lines on every run, bundling or not, so the debug compile's inputs match between
      # runs and its build-cache entry is reused. Signing values are placeholders unless bundling.
      #
      # Not a plain `cp`: the template's sdk.dir is a macOS path, and its SENTRY_USER_AUTH_TOKEN
      # placeholder would outrank the SENTRY_AUTH_TOKEN the build step supplies.
      - name: Create local.properties
        if: steps.changes.outputs.gradle == 'yes'
        env:
          BUNDLE: ${{ steps.changes.outputs.bundle }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          grep -E '^(APPWRITE_[A-Z_]+|SENTRY_DSN)=' local.properties.template > local.properties
          if [ "${BUNDLE}" = yes ]; then
            printf 'KEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
              "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" >> local.properties
          else
            printf 'KEYSTORE_PASSWORD=placeholder\nKEY_ALIAS=placeholder\nKEY_PASSWORD=placeholder\n' >> local.properties
          fi

      # GitHub's expression language has no arithmetic operators, so the offset cannot live in
      # a ${{ }} — it has to be computed by a shell.
      - name: Derive versionCode
        if: steps.changes.outputs.bundle == 'yes'
        run: echo "BOUNCER_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # A named version, checked against its hash. This step runs with the release keystore and
      # its passwords already on disk, and it used to pipe whatever sentry.io/get-cli/ served that
      # minute into bash.
      - name: Install sentry-cli
        if: steps.changes.outputs.bundle == 'yes'
        env:
          SENTRY_CLI_VERSION: 3.5.0
          SENTRY_CLI_SHA256: 522d469086996996322052b8f46bb679f010c53d884521023e79aa7680627104
        run: |
          curl -fsSL -o /tmp/sentry-cli "https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  /tmp/sentry-cli" | sha256sum --check
          sudo install -m 0755 /tmp/sentry-cli /usr/local/bin/sentry-cli
          printf 'defaults.project=android\ndefaults.org=tanush-4w\ncli.executable=/usr/local/bin/sentry-cli\n' > sentry.properties

      # One invocation, so the debug compile the tests and lint share is done once. The coverage
      # task depends on testDebugUnitTest, so it still fails on a failing test. No `--continue`: the
      # first failure ends the build, so a red run stops paying for lint, detekt and the bundle
      # (a red dispatch with it ran its full ~17 minutes). Any failure fails this step, and nothing
      # after it uploads.
      #
      # The unit tests run whenever Gradle does. A run with only `bundle` (its checks passed at the
      # commit it is measured from) keeps lintVitalRelease.
      #
      # lintVital* is not excluded from bundleRelease. It is the release-blocking subset — the check
      # that catches a NewApi call, a wrong exported flag or an invalid backup rule before an
      # upload.
      - name: Gradle
        if: steps.changes.outputs.gradle == 'yes'
        env:
          ANDROID_CHECKS: ${{ steps.changes.outputs.android }}
          BUNDLE: ${{ steps.changes.outputs.bundle }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.parallel=true"
        run: |
          set -euo pipefail
          tasks=(createDebugUnitTestCoverageReport)
          skip=()
          # One lint analysis, not two. A bundling run used to analyse the debug variant (lintDebug)
          # and then the release variant again for bundleRelease's lintVitalRelease, ~4 minutes
          # each. Full lint on the release variant checks everything lintVital does and everything
          # lintDebug did, so it replaces both; a run that does not bundle still lints debug and
          # never compiles release.
          if [ "${ANDROID_CHECKS}" = yes ] && [ "${BUNDLE}" = yes ]; then
            tasks+=(lintRelease detekt)
            skip=(-x lintVitalRelease)
          elif [ "${ANDROID_CHECKS}" = yes ]; then
            tasks+=(lintDebug detekt)
          fi
          if [ "${BUNDLE}" = yes ]; then tasks+=(bundleRelease); fi
          echo "Tasks: ${tasks[*]} ${skip[*]:-}"
          ./gradlew "${tasks[@]}" "${skip[@]}" --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure() && steps.changes.outputs.gradle == 'yes'
        with:
          name: test-results
          path: app/build/reports/tests/

      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.android == 'yes'
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html

      # Coverage is reported, not gated: an upload failure never blocks the Play build. The step is
      # skipped until CODECOV_TOKEN exists, and on Dependabot runs, which see no secrets.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: env.CODECOV_TOKEN != '' && steps.changes.outputs.gradle == 'yes'
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: app/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: unit

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.bundle == 'yes'
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # The tested bundle, to the path the Gradle build would have left it at.
      - name: Fetch the tested bundle
        if: steps.changes.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.changes.outputs.reuse }}
        run: |
          set -euo pipefail
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name release-aab --dir app/build/outputs/bundle/release
          test -s app/build/outputs/bundle/release/app-release.aab

      # A push whose commits carry a `Force-Update: yes` trailer uploads at in-app update priority
      # 5, which AppUpdatePolicy turns into Play's immediate update screen on every Play install.
      # Play fixes a release's priority at rollout, so this is the only moment to set it. The range
      # is everything since the last push that shipped, so a trailer in a `Ship: no` push still
      # counts when its changes go out. When the range cannot be read, or on a dispatch, only the
      # head commit counts: scanning the whole history would force every release after the first
      # forced one.
      #
      # The log is read into a variable, not piped: under the step shell's pipefail, `grep -q`
      # quitting at an early match can end `git log` with SIGPIPE and read as no match.
      - name: Is this a forced update?
        id: priority
        if: steps.changes.outputs.ship == 'yes'
        env:
          EVENT: ${{ github.event_name }}
          SHIP_BASE: ${{ steps.changes.outputs.ship_base }}
        run: |
          range=(-1 "${GITHUB_SHA}")
          if [ "${EVENT}" = push ] && [ -n "${SHIP_BASE}" ] && git cat-file -e "${SHIP_BASE}^{commit}" 2>/dev/null; then
            range=("${SHIP_BASE}..${GITHUB_SHA}")
          fi
          messages=$(git log --format=%B "${range[@]}")
          priority=0
          if grep -qiE '^Force-Update:[[:space:]]*yes[[:space:]]*$' <<< "${messages}"; then priority=5; fi
          echo "value=${priority}" >> "$GITHUB_OUTPUT"
          echo "In-app update priority: ${priority}"

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        if: steps.changes.outputs.ship == 'yes'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tanush.bouncer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # One upload, two tracks. `alpha` is the Play API id of the default closed testing
          # track, which waits on review; `internal` has no review, so the same build is
          # installable within minutes. No space after the comma.
          tracks: internal,alpha
          status: completed
          inAppUpdatePriority: ${{ steps.priority.outputs.value }}
          # Without this every release shipped with blank release notes.
          # distribution/whatsnew/README.md says who edits it and when.
          whatsNewDirectory: distribution/whatsnew

      # What the next push to main measures its bundle against (the "What changed?" step): a
      # commit whose push run succeeded with this artifact has shipped.
      - name: Record the release
        if: steps.changes.outputs.ship == 'yes'
        run: printf '%s %s\n' "${GITHUB_SHA}" "${BOUNCER_VERSION_CODE:-reused}" > "${RUNNER_TEMP}/shipped.txt"

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.ship == 'yes'
        with:
          name: shipped
          path: ${{ runner.temp }}/shipped.txt
          retention-days: 90

  # Submits the graph the ci job saved. Separate so that only this job, which runs no repository
  # code, holds a token that can write. A few seconds, but a whole billed minute, so only on a
  # bundling run on main whose range changed a dependency declaration.
  dependency-graph:
    name: Submit dependency graph
    needs: ci
    if: needs.ci.outputs.depgraph == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit
