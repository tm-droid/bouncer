# Required GitHub Secrets:
#
# Signing:
#   KEYSTORE_BASE64           — base64 -i app/bouncer-release.keystore | pbcopy, then paste here
#   KEYSTORE_PASSWORD         — keystore store password
#   KEY_ALIAS                 — bouncer
#   KEY_PASSWORD              — key password (same as KEYSTORE_PASSWORD for PKCS12)
#
# Play Store:
#   PLAY_SERVICE_ACCOUNT_JSON — full JSON of service account
#                               bouncer-ci@golden-object-498303-q9.iam.gserviceaccount.com
#
# API Keys (injected as BuildConfig fields at compile time):
#   RAPIDAPI_KEY
#   GROQ_API_KEY
#   CEREBRAS_API_KEY
#   SAMBANOVA_API_KEY
#   APPWRITE_ENDPOINT
#   APPWRITE_PROJECT_ID
#   APPWRITE_AI_CACHE_DB_ID
#   APPWRITE_AI_CACHE_COL_ID
#   APPWRITE_FAVOURITES_COL_ID
#   HIGHLIGHTLY_API_KEY
#   APPWRITE_HIGHLIGHTS_DB_ID
#   APPWRITE_HIGHLIGHTS_COL_ID
#   APPWRITE_PLAYER_FORMS_DB_ID
#   APPWRITE_PLAYER_FORMS_COL_ID
#   APPWRITE_PLAYER_PROFILES_COL_ID
#
# Error tracking:
#   SENTRY_AUTH_TOKEN         — Sentry auth token (ProGuard mapping upload on release)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          RAPIDAPI_KEY=
          GROQ_API_KEY=
          CEREBRAS_API_KEY=
          SAMBANOVA_API_KEY=
          APPWRITE_ENDPOINT=
          APPWRITE_PROJECT_ID=
          APPWRITE_AI_CACHE_DB_ID=
          APPWRITE_AI_CACHE_COL_ID=
          APPWRITE_FAVOURITES_COL_ID=
          HIGHLIGHTLY_API_KEY=
          APPWRITE_HIGHLIGHTS_DB_ID=
          APPWRITE_HIGHLIGHTS_COL_ID=
          APPWRITE_PLAYER_FORMS_DB_ID=
          APPWRITE_PLAYER_FORMS_COL_ID=
          APPWRITE_PLAYER_PROFILES_COL_ID=
          KEYSTORE_PASSWORD=placeholder
          KEY_ALIAS=placeholder
          KEY_PASSWORD=placeholder
          EOF

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: app/build/reports/tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          RAPIDAPI_KEY=
          GROQ_API_KEY=
          CEREBRAS_API_KEY=
          SAMBANOVA_API_KEY=
          APPWRITE_ENDPOINT=
          APPWRITE_PROJECT_ID=
          APPWRITE_AI_CACHE_DB_ID=
          APPWRITE_AI_CACHE_COL_ID=
          APPWRITE_FAVOURITES_COL_ID=
          HIGHLIGHTLY_API_KEY=
          APPWRITE_HIGHLIGHTS_DB_ID=
          APPWRITE_HIGHLIGHTS_COL_ID=
          APPWRITE_PLAYER_FORMS_DB_ID=
          APPWRITE_PLAYER_FORMS_COL_ID=
          APPWRITE_PLAYER_PROFILES_COL_ID=
          KEYSTORE_PASSWORD=placeholder
          KEY_ALIAS=placeholder
          KEY_PASSWORD=placeholder
          EOF

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    # Repository secrets are not exposed to workflow runs triggered by dependabot[bot], so
    # KEYSTORE_BASE64 expands to an empty string, `base64 --decode` writes a zero-byte file and
    # signing dies with `Failed to read key from store: Tag number over 30 is not supported`.
    # That failure has nothing to do with the dependency being bumped, and it made every single
    # Dependabot PR look broken — hiding whatever the bump actually did to the build. Unit Tests
    # and Lint still run for them, and those are the checks that can say anything useful here.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/bouncer-release.keystore

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY=${{ secrets.SAMBANOVA_API_KEY }}
          APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_AI_CACHE_DB_ID=${{ secrets.APPWRITE_AI_CACHE_DB_ID }}
          APPWRITE_AI_CACHE_COL_ID=${{ secrets.APPWRITE_AI_CACHE_COL_ID }}
          APPWRITE_FAVOURITES_COL_ID=${{ secrets.APPWRITE_FAVOURITES_COL_ID }}
          HIGHLIGHTLY_API_KEY=${{ secrets.HIGHLIGHTLY_API_KEY }}
          APPWRITE_HIGHLIGHTS_DB_ID=${{ secrets.APPWRITE_HIGHLIGHTS_DB_ID }}
          APPWRITE_HIGHLIGHTS_COL_ID=${{ secrets.APPWRITE_HIGHLIGHTS_COL_ID }}
          APPWRITE_PLAYER_FORMS_DB_ID=${{ secrets.APPWRITE_PLAYER_FORMS_DB_ID }}
          APPWRITE_PLAYER_FORMS_COL_ID=${{ secrets.APPWRITE_PLAYER_FORMS_COL_ID }}
          APPWRITE_PLAYER_PROFILES_COL_ID=${{ secrets.APPWRITE_PLAYER_PROFILES_COL_ID }}
          EOF

      # GitHub's expression language has no arithmetic operators, so the offset cannot live in
      # a ${{ }} — it has to be computed by a shell.
      - name: Derive versionCode
        run: echo "BOUNCER_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Install sentry-cli
        run: |
          curl -sL https://sentry.io/get-cli/ | INSTALL_DIR=/usr/local/bin bash
          printf 'defaults.project=android\ndefaults.org=tanush-4w\ncli.executable=/usr/local/bin/sentry-cli\n' > sentry.properties

      - name: Build release AAB
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.parallel=true"
        # lintVital* used to be excluded here. It is the release-blocking subset — the check
        # that catches a NewApi call, a wrong exported flag or an invalid backup rule before an
        # upload — so skipping it meant the release path had no lint at all.
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  publish:
    name: Publish to Play Store (Closed testing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # This used to carry `continue-on-error: true`, with a comment saying the app did not exist
    # in Play Console yet. It does, and has for a while — the job was failing every run with
    # "Version code 8 has already been used" while reporting nothing, which is the whole reason
    # nobody noticed that no build had reached the internal track (now closed testing) in weeks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tanush.bouncer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: alpha  # Play API id of the default closed testing track
          status: completed
          # Without this every release shipped with blank release notes.
          # distribution/whatsnew/README.md says who edits it and when.
          whatsNewDirectory: distribution/whatsnew
