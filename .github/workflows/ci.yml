# Required GitHub Secrets:
#
# Signing:
#   KEYSTORE_BASE64           — base64 -i app/bouncer-release.keystore | pbcopy, then paste here
#   KEYSTORE_PASSWORD         — keystore store password
#   KEY_ALIAS                 — bouncer
#   KEY_PASSWORD              — key password (same as KEYSTORE_PASSWORD for PKCS12)
#
# Play Store:
#   PLAY_SERVICE_ACCOUNT_JSON — full JSON of service account
#                               bouncer-ci@golden-object-498303-q9.iam.gserviceaccount.com
#
# No API key and no Appwrite id is a secret here. The app holds no credentials, and the Appwrite
# ids plus the Sentry DSN are read from local.properties.template by the release job.
#
# Error tracking:
#   SENTRY_AUTH_TOKEN         — Sentry auth token (ProGuard mapping upload on release)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels an older run on a pull request, never on main. On main every run ends in an
# upload to Play, and cancelling one part-way through that upload leaves a release half made.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # Signing placeholders only. The list that used to be here named provider keys the build
      # stopped reading long ago, and blank Appwrite ids, which the build treats as absent.
      - name: Create local.properties
        run: printf 'KEYSTORE_PASSWORD=placeholder\nKEY_ALIAS=placeholder\nKEY_PASSWORD=placeholder\n' > local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: app/build/reports/tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # Signing placeholders only. The list that used to be here named provider keys the build
      # stopped reading long ago, and blank Appwrite ids, which the build treats as absent.
      - name: Create local.properties
        run: printf 'KEYSTORE_PASSWORD=placeholder\nKEY_ALIAS=placeholder\nKEY_PASSWORD=placeholder\n' > local.properties

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # detekt 1.23 cannot run on JDK 25; 21 is what this workflow uses throughout.
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: printf 'KEYSTORE_PASSWORD=placeholder\nKEY_ALIAS=placeholder\nKEY_PASSWORD=placeholder\n' > local.properties

      - name: Run detekt
        run: ./gradlew detekt --no-daemon

  # The provider ladder, the fact-checker, the rewrite backlog and the win-probability maths exist
  # only in JavaScript. Their suites ran when someone remembered to run them before a deploy.
  functions:
    name: Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run every function's tests
        run: |
          set -euo pipefail
          for dir in appwrite/functions/*/; do
            grep -q '"test"' "$dir/package.json" 2>/dev/null || continue
            echo "::group::${dir}"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund && npm test)
            echo "::endgroup::"
          done

  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Everything that can say the tree is wrong, before anything is built to ship. Lint ran beside
    # this job without gating it, so a red lint run still published; detekt and the function
    # suites did not run here at all.
    needs: [test, lint, detekt, functions]
    # Repository secrets are not exposed to workflow runs triggered by dependabot[bot], so
    # KEYSTORE_BASE64 expands to an empty string, `base64 --decode` writes a zero-byte file and
    # signing dies with `Failed to read key from store: Tag number over 30 is not supported`.
    # That failure has nothing to do with the dependency being bumped, and it made every single
    # Dependabot PR look broken — hiding whatever the bump actually did to the build. Unit Tests
    # and Lint still run for them, and those are the checks that can say anything useful here.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/bouncer-release.keystore

      # The Appwrite ids and the Sentry DSN come from the checked-in template, not from secrets:
      # they are public configuration, and this step used to read them from secrets that were
      # never created. Every line came out as `KEY=`, so each build published to Play from
      # 2026-09-22 had a blank endpoint — no Appwrite call at all — and no DSN to report it, while
      # this job stayed green. `verifyReleaseConfig` now fails bundleRelease on a blank.
      #
      # Not a plain `cp`: the template's sdk.dir is a macOS path, and its SENTRY_USER_AUTH_TOKEN
      # placeholder would outrank the SENTRY_AUTH_TOKEN the build step supplies.
      - name: Create local.properties
        run: |
          grep -E '^(APPWRITE_[A-Z_]+|SENTRY_DSN)=' local.properties.template > local.properties
          cat >> local.properties << EOF
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      # GitHub's expression language has no arithmetic operators, so the offset cannot live in
      # a ${{ }} — it has to be computed by a shell.
      - name: Derive versionCode
        run: echo "BOUNCER_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # A named version, checked against its hash. This step runs with the release keystore and
      # its passwords already on disk, and it used to pipe whatever sentry.io/get-cli/ served that
      # minute into bash.
      - name: Install sentry-cli
        env:
          SENTRY_CLI_VERSION: 3.5.0
          SENTRY_CLI_SHA256: 522d469086996996322052b8f46bb679f010c53d884521023e79aa7680627104
        run: |
          curl -fsSL -o /tmp/sentry-cli "https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  /tmp/sentry-cli" | sha256sum --check
          sudo install -m 0755 /tmp/sentry-cli /usr/local/bin/sentry-cli
          printf 'defaults.project=android\ndefaults.org=tanush-4w\ncli.executable=/usr/local/bin/sentry-cli\n' > sentry.properties

      - name: Build release AAB
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.parallel=true"
        # lintVital* used to be excluded here. It is the release-blocking subset — the check
        # that catches a NewApi call, a wrong exported flag or an invalid backup rule before an
        # upload — so skipping it meant the release path had no lint at all.
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  publish:
    name: Publish to Play Store (Internal + closed testing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # This used to carry `continue-on-error: true`, with a comment saying the app did not exist
    # in Play Console yet. It does, and has for a while — the job was failing every run with
    # "Version code 8 has already been used" while reporting nothing, which is the whole reason
    # nobody noticed that no build had reached the internal track (now closed testing) in weeks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A push that changed only the functions, the docs or this workflow has no new app to ship,
      # and each upload starts a closed-testing review. When the range cannot be read (the first
      # push of a branch, a rewritten history) the build is published, as before.
      - name: Did this push change the app?
        id: app
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=yes
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE}" "${GITHUB_SHA}" \
              | grep -qE '^(app/|baselineprofile/|gradle/|distribution/|[^/]*\.gradle\.kts$|gradle\.properties$|local\.properties\.template$)' \
              || changed=no
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "App changed in this push: ${changed}"

      # A push whose commits carry a `Force-Update: yes` trailer uploads at in-app update priority
      # 5, which AppUpdatePolicy turns into Play's immediate update screen on every Play install.
      # Play fixes a release's priority at rollout, so this is the only moment to set it. When the
      # range cannot be read, only the head commit counts: scanning the whole history would force
      # every release after the first forced one.
      - name: Is this a forced update?
        id: priority
        if: steps.app.outputs.changed == 'yes'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range=(-1 "${GITHUB_SHA}")
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then range=("${BEFORE}..${GITHUB_SHA}"); fi
          priority=0
          if git log --format=%B "${range[@]}" | grep -qiE '^Force-Update:[[:space:]]*yes[[:space:]]*$'; then priority=5; fi
          echo "value=${priority}" >> "$GITHUB_OUTPUT"
          echo "In-app update priority: ${priority}"

      - uses: actions/download-artifact@v8
        if: steps.app.outputs.changed == 'yes'
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        if: steps.app.outputs.changed == 'yes'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tanush.bouncer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # One upload, two tracks. `alpha` is the Play API id of the default closed testing
          # track, which waits on review; `internal` has no review, so the same build is
          # installable within minutes. No space after the comma.
          tracks: internal,alpha
          status: completed
          inAppUpdatePriority: ${{ steps.priority.outputs.value }}
          # Without this every release shipped with blank release notes.
          # distribution/whatsnew/README.md says who edits it and when.
          whatsNewDirectory: distribution/whatsnew
