# Daily refit of the win-probability model.
#
# This was the Appwrite function `bouncer-train-win-probability`. It peaks near 760 MB, and
# Appwrite's Free plan fixes every function at 512 MB, so it runs here and writes the same
# `winprob-manifest`, `winprob-v6-<stamp>`, `wpx-*` and `wps-*` files to the `cricket-stats` bucket.
# `bouncer-match-sync` picks a new model up by itself (it re-reads the manifest hourly).
#
# Required GitHub Secret:
#   APPWRITE_API_KEY — the server key the function used (Storage read and write on `cricket-stats`)
#
# Daily, because serving reads team form, Elo, head-to-head and ground tables from the published model:
# a weekly refit left them up to 7-15 days behind the match (reports/B10.md: 91-95% of the live
# Elo/form skew). The trainer keeps only the current and previous model files, so storage does not grow.
# A scheduled workflow can start late under load; for a daily job that is harmless.

name: Train win probability

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: train-win-probability
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # The Android app, its functions and tools live under android/ in the monorepo.
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/appwrite/functions/train-win-probability/package-lock.json

      - name: Install
        working-directory: android/appwrite/functions/train-win-probability
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Train and publish
        env:
          APPWRITE_FUNCTION_API_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          APPWRITE_FUNCTION_PROJECT_ID: 6a02f7f3000e6e100b19
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          STATS_BUCKET_ID: cricket-stats
        run: node appwrite/tools/run-function.mjs train-win-probability
