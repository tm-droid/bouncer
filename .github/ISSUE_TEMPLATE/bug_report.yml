name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in Bouncer
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One line description of the bug
      placeholder: e.g. App crashes when opening Player Detail screen
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear steps to trigger the bug
      placeholder: |
        1. Open the app
        2. Tap on a live match
        3. Tap on a player name
        4. App crashes
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      placeholder: What actually happens?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g. 1.0 (build 5)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & Android Version
      placeholder: e.g. Pixel 8 — Android 15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste any relevant logcat output or Sentry error ID
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, screen recordings, or anything else helpful
