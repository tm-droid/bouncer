name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make Bouncer better? Describe it below!

  - type: input
    id: summary
    attributes:
      label: Feature Summary
      placeholder: e.g. Add DLS par score indicator on match card
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Why would it be valuable?
      placeholder: e.g. During rain interruptions there's no quick way to see the DLS par score without tapping into the full match detail.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought of?

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Live Scores
        - Match Detail
        - Win Probability / Analysis
        - AI / Intelligence
        - Stats
        - Player Profiles
        - Widgets
        - UI / Design
        - Notifications / Reminders
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, references, or anything else helpful
