[versions]
# ── Plugins ────────────────────────────────────────────────────────────────────
agp = "9.3.0"
kotlin = "2.4.20"
sentry-gradle = "6.14.0"
# detekt 1.23.x embeds a Kotlin 1.9 frontend and cannot run on JDK 25 (see the jvmTarget pin and
# the JBR-21 invocation in CLAUDE.md). Moving to the 2.x line is a separate change: 2.x reworks the
# config schema, so it needs its own pass over app/config/detekt.yml.
detekt = "1.23.8"

# ── AndroidX Core ──────────────────────────────────────────────────────────────
core-ktx = "1.19.0"
core-splashscreen = "1.2.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
savedstate = "1.5.0"

# ── Compose ────────────────────────────────────────────────────────────────────
compose-bom = "2026.06.01"
navigation-compose = "2.9.8"

# ── Networking ─────────────────────────────────────────────────────────────────
okhttp = "5.4.0"
coil = "2.7.0"
jsoup = "1.23.2"
appwrite = "25.1.0"
play-app-update = "2.1.0"

# ── Serialization & Logging ───────────────────────────────────────────────────
gson = "2.13.2"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"

# ── UI & Layout ────────────────────────────────────────────────────────────────
palette = "1.0.0"
work = "2.11.2"
datastore = "1.2.1"

# ── Glance ─────────────────────────────────────────────────────────────────────
glance = "1.1.1"

# ── Room ───────────────────────────────────────────────────────────────────────
room = "2.8.4"
ksp = "2.3.13"

# ── Paging ────────────────────────────────────────────────────────────────────

# ── Firebase ──────────────────────────────────────────────────────────────────
firebase-bom = "33.7.0"
google-services = "4.5.0"

# ── Debug ─────────────────────────────────────────────────────────────────────
leakcanary = "2.14"

# ── Car App ───────────────────────────────────────────────────────────────────
car-app = "1.7.0"

# ── Security overrides (explicit patched versions for vulnerable transitive deps)

# ── Testing ────────────────────────────────────────────────────────────────────
junit = "4.13.2"
androidx-test-ext = "1.3.0"
espresso = "3.7.0"
baselineprofile = "1.5.0"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
mockk = "1.14.11"


[libraries]
# ── AndroidX Core ──────────────────────────────────────────────────────────────
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
savedstate-ktx = { module = "androidx.savedstate:savedstate-ktx", version.ref = "savedstate" }

# ── Compose ────────────────────────────────────────────────────────────────────
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material = { module = "androidx.compose.material:material" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# ── Networking ─────────────────────────────────────────────────────────────────
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
appwrite = { module = "io.appwrite:sdk-for-android", version.ref = "appwrite" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }

# ── UI & Layout ────────────────────────────────────────────────────────────────
palette = { module = "androidx.palette:palette", version.ref = "palette" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

# ── Glance ─────────────────────────────────────────────────────────────────────
glance = { module = "androidx.glance:glance", version.ref = "glance" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

# ── Serialization & Logging ───────────────────────────────────────────────────
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# ── Room ───────────────────────────────────────────────────────────────────────
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# ── Paging ────────────────────────────────────────────────────────────────────

# ── Firebase ──────────────────────────────────────────────────────────────────
firebase-bom-lib = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging-ktx" }

# ── Debug ─────────────────────────────────────────────────────────────────────
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# ── Car App ───────────────────────────────────────────────────────────────────
car-app = { module = "androidx.car.app:app", version.ref = "car-app" }

# ── Security overrides ─────────────────────────────────────────────────────────

# ── Testing ────────────────────────────────────────────────────────────────────
json = { module = "org.json:json", version = "20260522" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentry-gradle" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
